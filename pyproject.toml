[project]
name = "puzzlebox"
version = "0.1.0"
description = "A lightweight Python desktop quiz application with multiple-choice questions, scoring, and extensible question sources."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.5",
    "pyside6>=6.11.2",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "types-pyyaml>=6.0.12.20260815",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
puzzlebox = "puzzlebox.main:main"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
