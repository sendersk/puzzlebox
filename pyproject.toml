[project]
name = "puzzlebox"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.5",
    "pyside6>=6.11.2",
    "pyyaml>=6.0.3",
